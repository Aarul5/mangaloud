# Builds the debug APK on request only: Actions > Build APK > Run workflow,
# or `gh workflow run build-apk.yml`. Never runs on push.
#
# The APK goes on a pre-release named apk-<run number> (get it with `gh release download`).
# Releases do not count towards the Actions artifact storage, which filled up with APKs. Only
# the last 5 APK pre-releases are kept.
#
# Every APK must be signed with the same key, or Android refuses to install it over the last
# one. Save the key as the DEBUG_KEYSTORE_BASE64 secret (base64 of a debug.keystore with the
# standard "android" passwords). Without the secret, the run makes a new key and uploads it as
# the short-lived "debug-keystore" artifact, so it can be saved as the secret.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug, or release (shrunk, like a published release, but signed with the debug key)"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write # to publish the APK as a pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        id: key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # The build reads the key from DEBUG_KEYSTORE_PATH (see app/build.gradle.kts). Left to
          # find ~/.android/debug.keystore itself, it made a new key on every run, so no APK
          # would install over the last one.
          mkdir -p "$RUNNER_TEMP/keystore"
          store="$RUNNER_TEMP/keystore/debug.keystore"
          if [ -n "$DEBUG_KEYSTORE" ]; then
            # Line endings or spaces picked up when the secret was saved are not base64.
            printf '%s' "$DEBUG_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$store"
          else
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret: this APK is signed with a new key."
            keytool -genkeypair -keystore "$store" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          keytool -list -keystore "$store" -storepass android -alias androiddebugkey > /dev/null
          echo "DEBUG_KEYSTORE_PATH=$store" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          chmod +x gradlew
          task=$([ "$VARIANT" = release ] && echo assembleRelease || echo assembleDebug)
          BUILD_NUMBER=$((100 + ${{ github.run_number }})) ./gradlew testDebugUnitTest "$task" --no-daemon
          cp "app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" app/build/built.apk

      - name: Check the app icon made it into the APK
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=android/app/build/built.apk
          "$tools/aapt2" dump resources "$apk" > resources.txt
          if unzip -p "$apk" 'res/*' resources.arsc | grep -a -q STRING_TOO_LARGE; then
            echo "::error::A resource string is too long for Android and was replaced by STRING_TOO_LARGE."
            exit 1
          fi
          grep -E -A3 'mipmap/ic_launcher|drawable/ic_launcher|drawable/ic_logo|drawable/\$ic_launcher' resources.txt || true
          for name in mipmap/ic_launcher drawable/ic_launcher_foreground drawable/ic_launcher_background drawable/ic_launcher_monochrome; do
            # Each must have a file behind it, not be missing or emptied by resource shrinking.
            file=$(grep -A2 "resource .* $name\$" resources.txt | grep -o '(file) [^ ]*' | head -1 | cut -d' ' -f2)
            if [ -z "$file" ]; then echo "::error::$name has no file in the APK"; exit 1; fi
            size=$(unzip -l "$apk" "$file" | awk 'NR==4 {print $1}')
            echo "$name -> $file ($size bytes)"
            if [ "${size:-0}" -lt 100 ]; then echo "::error::$name is empty in the APK"; exit 1; fi
          done

      - name: Check the APK is signed with the saved key
        run: |
          expected=$(keytool -exportcert -keystore "$DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          actual=$("$tools/apksigner" verify --print-certs android/app/build/built.apk \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Signed with $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The APK is not signed with the saved key, so it would not install over the last one."
            exit 1
          fi

      - name: Publish the APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          short=$(git rev-parse --short HEAD)
          suffix=$([ "$VARIANT" = release ] && echo "-release" || echo "")
          apk="mangaloud-$short$suffix.apk"
          cp android/app/build/built.apk "$apk"
          gh release create "apk-$RUN" "$apk" --prerelease --target "$GITHUB_SHA"             --title "APK $short ($BRANCH, $VARIANT)" --notes "$VARIANT build of $BRANCH at $short (run $RUN), signed with the debug key."
          # Keep the last 5 APK pre-releases; older ones and their tags go.
          gh release list --limit 100 --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName'             | grep '^apk-[0-9]*$' | sort -t- -k2 -n -r | tail -n +6             | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

      - name: New signing key
        if: steps.key.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: ${{ runner.temp }}/keystore/debug.keystore
          retention-days: 1
