# Publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Builds the shrunk release APK, signs it with the project's release key, checks the signature,
# and attaches it to a GitHub Release named after the tag, with that version's CHANGELOG notes.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   base64 of the release keystore file
#   RELEASE_KEYSTORE_PASSWORD the keystore's password
#   RELEASE_KEY_ALIAS         the key's alias in it
#   RELEASE_KEY_PASSWORD      the key's password (often the same as the keystore's)
# Without them the run stops: a public release is never signed with a debug key.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The release key secrets are missing. See the top of .github/workflows/release.yml."
            exit 1
          fi
          store="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$store"
          keytool -list -keystore "$store" -storepass "$STORE_PASSWORD" -alias "$ALIAS" > /dev/null
          {
            echo "RELEASE_KEYSTORE_PATH=$store"
            echo "RELEASE_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          version="${GITHUB_REF_NAME#v}"
          # Version 1.2.3 becomes code 10203, so every release installs over the one before.
          IFS=. read -r major minor patch <<< "${version%%-*}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          VERSION_NAME="$version" BUILD_NUMBER="$code" ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Check the APK is signed with the release key
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          expected=$(keytool -exportcert -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          actual=$("$tools/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Signed with $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The APK is not signed with the release key."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          apk="mangaloud-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # This version's section of CHANGELOG.md ("## 0.1.0 ..." up to the next "## ").
          awk -v v="$version" '/^## /{ if (found) exit; if (index($0, "## " v) == 1) { found=1; next } } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Manga Loud $version." > notes.md
          prerelease=$([[ "$version" == *-* ]] && echo "--prerelease" || echo "")
          gh release create "$TAG" "$apk" "$apk.sha256" --title "Manga Loud $version" --notes-file notes.md $prerelease
