name: Bug report
description: Something in the app or relay doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste keys, tokens or relay logs that contain them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chapter on ...
        2. Press Read ...
  - type: dropdown
    id: reading
    attributes:
      label: How the app reads text
      options:
        - PC relay
        - Claude API key
        - Not sure
  - type: dropdown
    id: voice
    attributes:
      label: Voice
      options:
        - Phone voice
        - PC voice (OmniVoice)
        - Fish Audio
        - Other cloud voice
        - Not sure
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > About.
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Remove any keys or tokens first. Only share comic pages you have the right to share.
