<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Loud</title>
<meta name="description" content="An Android browser that reads manga, manhwa and webtoon speech bubbles aloud with expressive voices.">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14141a; color: #ececf1; font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 34px; margin: 0 0 8px; color: #ffb020; }
  a { color: #ffb020; }
  .shots { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
  .shots img { width: calc(33.3% - 8px); min-width: 160px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <p><img src="logo.webp" alt="Manga Loud logo" style="width:100%;max-width:420px;display:block;margin:0 auto 12px"></p>
  <h1>Manga Loud</h1>
  <p>An Android browser for manga, manhwa and webtoon sites that reads the speech bubbles aloud with expressive voices, and glides the page along with the voice.</p>
  <div class="shots">
    <img src="screenshots/home.png" alt="Manga Loud's home screen">
    <img src="screenshots/voice.png" alt="Voice settings: phone, Fish Audio, ElevenLabs, Gemini or a PC voice server">
    <img src="screenshots/reading-settings.png" alt="Reading settings">
  </div>
  <p>Source code, setup and downloads: <a href="https://github.com/Aarul5/mangaloud">github.com/Aarul5/mangaloud</a>. Free software under GPL-3.0.</p>
</main>
</body>
</html>
